<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f3e5c">
  <meta name="description" content="Two of You: a memory-matching game made from your own photos.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Two of You">
  <title>Two of You</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <!-- The tile-back design lives in its own file so it can be swapped out. See README. -->
  <link rel="stylesheet" href="css/tile-back.css">
</head>
<body>
  <main id="app">

    <!-- ============ 1. Setup ============ -->
    <section id="screen-setup" class="screen screen-scroll" aria-labelledby="setup-title">
      <div class="column">
        <header class="brand">
          <div class="brand-tiles" aria-hidden="true">
            <div class="brand-tile tile-back"></div>
            <div class="brand-tile tile-back"></div>
          </div>
          <h1 id="setup-title" tabindex="-1">Two of You</h1>
          <p class="tagline">A memory game made from your own photos</p>
        </header>

        <fieldset class="group">
          <legend>Difficulty</legend>
          <div class="choices choices-3">
            <label class="choice"><input type="radio" name="difficulty" value="easy"><span>Easy<small>6 pairs · 12 tiles</small></span></label>
            <label class="choice"><input type="radio" name="difficulty" value="medium"><span>Medium<small>8 pairs · 16 tiles</small></span></label>
            <label class="choice"><input type="radio" name="difficulty" value="hard"><span>Hard<small>12 pairs · 24 tiles</small></span></label>
          </div>
        </fieldset>

        <fieldset class="group">
          <legend>Players</legend>
          <div class="choices choices-4">
            <label class="choice"><input type="radio" name="players" value="1"><span>1</span></label>
            <label class="choice"><input type="radio" name="players" value="2"><span>2</span></label>
            <label class="choice"><input type="radio" name="players" value="3"><span>3</span></label>
            <label class="choice"><input type="radio" name="players" value="4"><span>4</span></label>
          </div>
          <div id="setup-names" class="name-fields"></div>
          <p class="hint">Names are optional.</p>
        </fieldset>

        <div class="group group-row">
          <label class="switch">
            <input type="checkbox" id="setup-sound">
            <span class="switch-track" aria-hidden="true"></span>
            <span>Sound</span>
          </label>
        </div>

        <div class="actions">
          <button type="button" id="btn-to-photos" class="btn primary btn-wide">Choose photos</button>
        </div>

        <p class="about-row"><button type="button" id="btn-about" class="about-link">About</button></p>
      </div>
    </section>

    <!-- ============ 2. Photos ============ -->
    <section id="screen-photos" class="screen screen-scroll" aria-labelledby="photos-title" hidden>
      <div class="column column-wide">
        <header class="screen-head">
          <h2 id="photos-title" tabindex="-1">Choose photos</h2>
          <p id="photos-sub" class="sub"></p>
        </header>

        <p id="photo-status" class="status" role="status" aria-live="polite"></p>

        <div id="photo-errors" class="notice" role="alert" hidden></div>

        <div id="photo-tray" class="photo-tray"></div>

        <input type="file" id="file-input" class="visually-hidden" accept="image/*" multiple tabindex="-1" aria-hidden="true">

        <div class="actions actions-sticky">
          <button type="button" id="btn-photos-back" class="btn">Back</button>
          <button type="button" id="btn-add-photos" class="btn">Add photos</button>
          <button type="button" id="btn-clear-photos" class="btn btn-quiet" hidden>Clear</button>
          <button type="button" id="btn-dev-photos" class="btn btn-quiet" hidden>Load placeholder photos (dev)</button>
          <button type="button" id="btn-start" class="btn primary" disabled>Start game</button>
        </div>
      </div>
    </section>

    <!-- ============ 3. Game ============ -->
    <section id="screen-game" class="screen screen-game" aria-label="Game" hidden>
      <div class="game-bar">
        <div id="score-strip" class="score-strip" aria-live="polite"></div>
        <button type="button" id="btn-menu" class="icon-btn" aria-label="Menu and settings">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>
        </button>
      </div>

      <div id="board-wrap" class="board-wrap">
        <div id="board" class="board"></div>
      </div>

      <div class="turn-bar">
        <p id="turn-msg" class="turn-msg" aria-live="polite"></p>
        <button type="button" id="btn-finish-turn" class="btn finish" hidden>Finish turn</button>
      </div>
    </section>

    <!-- ============ 4. End ============ -->
    <section id="screen-end" class="screen screen-scroll" aria-labelledby="end-title" hidden>
      <div class="column column-wide">
        <header class="screen-head">
          <h2 id="end-title" tabindex="-1"></h2>
          <p id="end-sub" class="sub"></p>
        </header>
        <ol id="end-scores" class="end-scores"></ol>
        <div id="end-gallery" class="gallery" aria-label="Photos from this game"></div>
        <div class="actions">
          <button type="button" id="btn-play-again" class="btn primary">Play again</button>
          <button type="button" id="btn-new-photos" class="btn">New photos</button>
          <button type="button" id="btn-change-settings" class="btn">Change settings</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Match reveal overlay -->
  <div id="reveal" class="reveal" hidden>
    <div class="reveal-card"><img id="reveal-img" alt="Matched photo"></div>
    <div id="confetti" class="confetti" aria-hidden="true"></div>
  </div>

  <!-- In-game menu / settings -->
  <dialog id="menu-dialog" class="menu-dialog" aria-labelledby="menu-title">
    <form method="dialog" class="menu-body">
      <h2 id="menu-title">Settings</h2>
      <label class="switch">
        <input type="checkbox" id="menu-sound">
        <span class="switch-track" aria-hidden="true"></span>
        <span>Sound</span>
      </label>
      <fieldset class="group">
        <legend>Player names</legend>
        <div id="menu-names" class="name-fields"></div>
      </fieldset>
      <div class="actions">
        <button type="button" id="btn-menu-restart" class="btn">Restart game</button>
        <button type="button" id="btn-menu-quit" class="btn">Quit to setup</button>
        <button type="submit" class="btn primary">Done</button>
      </div>
    </form>
  </dialog>

  <!-- About: copyright and licenses -->
  <dialog id="about-dialog" class="menu-dialog about-dialog" aria-labelledby="about-title">
    <form method="dialog" class="menu-body">
      <h2 id="about-title">About</h2>
      <p>© 2026 Michael A. Heroux</p>
      <p>Code is MIT licensed. Everything else is CC BY 4.0.</p>
      <ul class="about-links">
        <li><a href="https://opensource.org/license/mit" target="_blank" rel="noopener">MIT License</a></li>
        <li><a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a></li>
      </ul>
      <div class="actions">
        <button type="submit" class="btn primary">Close</button>
      </div>
    </form>
  </dialog>

  <script src="js/audio.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
